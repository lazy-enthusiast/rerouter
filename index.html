<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHA(5)'s Assistants</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
      overflow: hidden;
    }
    header {
      height: 48px;
      background-color: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: #cccccc;
      letter-spacing: 0.5px;
    }
    .nav-controls {
      display: flex;
      gap: 8px;
    }
    .model-btn {
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      color: #999999;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .model-btn:hover {
      background: #383838;
      color: #ffffff;
    }
    .model-btn.active {
      background: #0e639c;
      border-color: #1177bb;
      color: #ffffff;
      font-weight: 500;
    }
    .view-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 48px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background-color: #ffffff;
    }
    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">ADHA(5)'s Assistants</div>
    <div class="nav-controls">
      <button class="model-btn active" onclick="switchModel('claude')">Claude Sonnet 5</button>
      <button class="model-btn" onclick="switchModel('o3mini')">ChatGPT o3-mini</button>
      <button class="model-btn" onclick="switchModel('gpt4o')">ChatGPT 4o</button>
    </div>
  </header>

  <div class="view-container">
    <!-- 請將以下 src 屬性替換為對應應用的專屬公開存取網址 -->
    <iframe id="iframe-claude" class="active" src="https://udify.app/chat/CSUkcEUyf7JTtMTY"></iframe>
    <iframe id="iframe-o3mini" src="https://udify.app/chat/0oI5K7524t5oVLrj"></iframe>
    <iframe id="iframe-gpt4o" src="https://udify.app/chat/NLMA3nQF3jEhtQmQ"></iframe>
  </div>

  <script>
    function switchModel(modelKey) {
      document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));

      if (modelKey === 'claude') {
        document.querySelectorAll('.model-btn')[0].classList.add('active');
        document.getElementById('iframe-claude').classList.add('active');
      } else if (modelKey === 'o3mini') {
        document.querySelectorAll('.model-btn')[1].classList.add('active');
        document.getElementById('iframe-o3mini').classList.add('active');
      } else if (modelKey === 'gpt4o') {
        document.querySelectorAll('.model-btn')[2].classList.add('active');
        document.getElementById('iframe-gpt4o').classList.add('active');
      }
    }
  </script>

</body>
</html>
